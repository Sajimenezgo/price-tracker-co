<!doctype html>
<html lang="es" class="overflow-x-hidden">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Price Tracker Electrodomésticos Colombia</title>
  <meta name="description" content="Comparador de precios y simulador financiero inteligente para electrodomésticos en Colombia (Éxito, Falabella y Jumbo).">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 antialiased min-h-screen overflow-x-hidden">
<header class="sticky top-0 z-20 bg-white/90 dark:bg-slate-800/90 backdrop-blur border-b border-slate-200 dark:border-slate-700">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-3">
    <h1 class="font-bold text-lg flex items-center gap-1.5">
      <span>⚡</span>
      <span>Price Tracker</span>
    </h1>
    <span id="updated" class="text-xs text-slate-500 dark:text-slate-400 hidden sm:inline"></span>
    <button
      id="openCart"
      type="button"
      class="ml-auto relative inline-flex items-center gap-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm transition-colors"
      aria-haspopup="dialog"
      aria-expanded="false"
      aria-controls="drawer"
    >
      <span>🛒 Carrito</span>
      <span id="cartCount" class="rounded-full bg-white text-indigo-700 px-2 py-0.5 text-xs font-bold leading-none">0</span>
    </button>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6 grid gap-6 lg:grid-cols-[260px_1fr]">
  <aside class="space-y-4 lg:sticky lg:top-20 self-start">
    <div>
      <label for="q" class="sr-only">Buscar marca o modelo</label>
      <input
        id="q"
        type="search"
        placeholder="Buscar marca, modelo…"
        class="w-full rounded-lg border border-slate-300 dark:border-slate-600 px-3 py-2 text-sm bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
      >
    </div>

    <button id="toggleFilters" type="button" aria-expanded="false" aria-controls="filtersPanel"
      class="lg:hidden w-full flex items-center justify-between rounded-lg border border-slate-300 dark:border-slate-600 px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <span>Filtros <span id="filterBadge" class="ml-1 hidden rounded-full bg-indigo-600 text-white text-xs px-2 py-0.5"></span></span><span aria-hidden="true">▾</span>
    </button>
    <div id="filtersPanel" class="hidden lg:block space-y-4">
    <fieldset class="border border-slate-200 dark:border-slate-700 rounded-lg p-3">
      <legend class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 px-1">Tienda</legend>
      <div id="fStores" class="space-y-1.5 mt-1"></div>
    </fieldset>

    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300">
      Categoría
      <select
        id="fCat"
        class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-600 px-3 py-2 text-sm bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
      ></select>
    </label>

    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300">
      Marca
      <select
        id="fBrand"
        class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-600 px-3 py-2 text-sm bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
      ></select>
    </label>

    <div class="grid grid-cols-2 gap-2">
      <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">
        Mín $
        <input
          id="pMin"
          type="number"
          min="0"
          step="50000"
          placeholder="0"
          class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-600 px-2 py-2 text-sm bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        >
      </label>
      <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">
        Máx $
        <input
          id="pMax"
          type="number"
          min="0"
          step="50000"
          placeholder="Sin límite"
          class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-600 px-2 py-2 text-sm bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        >
      </label>
    </div>

    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300">
      Ordenar por
      <select
        id="sort"
        class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-600 px-3 py-2 text-sm bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
      >
        <option value="price">Precio: menor a mayor</option>
        <option value="-price">Precio: mayor a menor</option>
        <option value="-discount_pct">Mayor descuento</option>
        <option value="name">Nombre alfabético</option>
      </select>
    </label>
    </div>
  </aside>

  <section class="min-w-0">
    <p id="resultInfo" class="text-sm text-slate-500 dark:text-slate-400 mb-3" aria-live="polite"></p>
    <div id="grid" class="grid gap-4 grid-cols-1 sm:grid-cols-2 xl:grid-cols-3"></div>
    <button
      id="more"
      type="button"
      class="hidden mx-auto mt-6 rounded-lg border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 px-6 py-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500 transition-colors"
    >
      Ver más productos
    </button>
  </section>
</main>

<!-- Drawer del carrito y simulador financiero -->
<div
  id="drawer"
  class="fixed inset-0 z-30 hidden overflow-x-hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="drawerTitle"
  tabindex="-1"
>
  <div id="backdrop" class="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity"></div>
  <div
    id="drawerContent"
    class="absolute right-0 top-0 h-full w-full max-w-3xl overflow-y-auto overflow-x-hidden bg-white dark:bg-slate-800 p-4 sm:p-6 space-y-6 shadow-2xl focus:outline-none"
  >
    <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-3">
      <h2 id="drawerTitle" class="text-lg sm:text-xl font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2">
        <span>🛒</span>
        <span>Carrito y simulador financiero</span>
      </h2>
      <button
        id="closeCart"
        type="button"
        class="rounded-lg p-1.5 text-2xl leading-none text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors"
        aria-label="Cerrar carrito"
      >
        &times;
      </button>
    </div>

    <!-- Componente 1: Carrito de compras (items, fletes y escenarios comparativos) -->
    <div id="cartContainer" class="space-y-6"></div>

    <!-- Componente 2: Panel de simulación de pagos, gráfico y recomendación -->
    <div id="paymentContainer" class="space-y-6"></div>

    <!-- Componente 3: Tabla de amortización detallada (1-72 meses) -->
    <div id="amortizationContainer" class="space-y-4"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
