name: Actualizar precios

on:
  schedule:
    # 02:00 hora Colombia (UTC-5, sin horario de verano) = 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # rama de despliegue (GitHub Pages sirve /docs desde main)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Ejecutar scraper
        run: python -m scraper.main

      - name: Commit automático de data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "chore(data): actualizar precios $(TZ=America/Bogota date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push origin main
          fi
